<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="AI cyber policy compliance architecture">
  <rect width="1200" height="380" fill="#f8fafc"/>
  <style>
    .box{fill:#ffffff;stroke:#2563eb;stroke-width:2;rx:16}
    .title{font:700 28px Arial,Helvetica,sans-serif;fill:#0f172a}
    .text{font:600 16px Arial,Helvetica,sans-serif;fill:#1e293b}
    .sub{font:500 13px Arial,Helvetica,sans-serif;fill:#475569}
    .arrow{stroke:#2563eb;stroke-width:4;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="60" y="46" class="title">AI Cyber Policy Compliance Auditor — Architecture</text>

  <rect class="box" x="40" y="95" width="170" height="90"/>
  <text x="66" y="128" class="text">Policy</text>
  <text x="66" y="152" class="text">Documents</text>
  <text x="66" y="174" class="sub">policies and controls</text>

  <rect class="box" x="250" y="95" width="170" height="90"/>
  <text x="276" y="128" class="text">Policy</text>
  <text x="276" y="152" class="text">Parser</text>
  <text x="276" y="174" class="sub">structured review units</text>

  <rect class="box" x="460" y="95" width="180" height="90"/>
  <text x="486" y="128" class="text">Control Mapping</text>
  <text x="486" y="152" class="text">Engine</text>
  <text x="486" y="174" class="sub">framework alignment</text>

  <rect class="box" x="680" y="95" width="170" height="90"/>
  <text x="706" y="128" class="text">Gap</text>
  <text x="706" y="152" class="text">Analysis</text>
  <text x="706" y="174" class="sub">missing coverage</text>

  <rect class="box" x="890" y="95" width="220" height="90"/>
  <text x="916" y="128" class="text">Evidence Review</text>
  <text x="916" y="152" class="text">+ Audit Queue</text>
  <text x="916" y="174" class="sub">priority review artifacts</text>

  <path class="arrow" d="M210 140 L250 140"/>
  <path class="arrow" d="M420 140 L460 140"/>
  <path class="arrow" d="M640 140 L680 140"/>
  <path class="arrow" d="M850 140 L890 140"/>

  <rect class="box" x="360" y="245" width="220" height="90"/>
  <text x="388" y="278" class="text">Reports + Findings</text>
  <text x="388" y="302" class="text">Summary</text>
  <text x="388" y="324" class="sub">Markdown, CSV, JSON</text>

  <rect class="box" x="650" y="245" width="220" height="90"/>
  <text x="678" y="278" class="text">Audit Ledger</text>
  <text x="678" y="302" class="text">and Traceability</text>
  <text x="678" y="324" class="sub">reproducible run log</text>

  <path class="arrow" d="M1000 185 C1000 220 880 220 870 290"/>
  <path class="arrow" d="M580 290 L650 290"/>

  <text x="355" y="360" class="sub">Human review required — outputs support compliance analysis, not automatic certification.</text>
</svg>
