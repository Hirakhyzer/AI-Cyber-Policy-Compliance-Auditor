<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AI Cyber Policy Compliance Auditor banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title{font:800 42px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-.6px}
      .sub{font:700 21px Arial,Helvetica,sans-serif;fill:#bfdbfe}
      .body{font:500 15.5px Arial,Helvetica,sans-serif;fill:#dbeafe}
      .chip{font:700 13px Arial,Helvetica,sans-serif;fill:#eff6ff}
      .tiny{font:500 12px Arial,Helvetica,sans-serif;fill:#94a3b8}
      .card{font:700 14px Arial,Helvetica,sans-serif;fill:#e0f2fe}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.14" stroke="#dbeafe" stroke-width="1.1" fill="none">
    <path d="M64 88 C210 44 342 144 500 90 C664 34 812 106 956 146 C1052 172 1122 144 1160 112"/>
    <path d="M72 272 C208 222 338 302 494 254 C660 204 818 248 956 286 C1048 310 1116 286 1162 238"/>
    <path d="M120 68 L290 132 L470 82 L658 176 L850 96 L1060 164"/>
  </g>

  <g transform="translate(72 70)">
    <text class="title" x="0" y="48">AI Cyber Policy Compliance Auditor</text>
    <text class="sub" x="0" y="88">Control Mapping • Gap Analysis • Audit Evidence Review</text>
    <text class="body" x="0" y="126">Research-grade compliance lab for cybersecurity governance, explainable policy review, and human-audited reporting.</text>

    <g transform="translate(0 168)">
      <rect x="0" y="0" width="126" height="32" rx="16" fill="#2563eb" opacity="0.95"/>
      <text class="chip" x="63" y="21" text-anchor="middle">Policy Review</text>
      <rect x="144" y="0" width="142" height="32" rx="16" fill="#0f766e" opacity="0.95"/>
      <text class="chip" x="215" y="21" text-anchor="middle">Control Mapping</text>
      <rect x="304" y="0" width="122" height="32" rx="16" fill="#7c3aed" opacity="0.95"/>
      <text class="chip" x="365" y="21" text-anchor="middle">Gap Audit</text>
      <rect x="444" y="0" width="140" height="32" rx="16" fill="#0891b2" opacity="0.95"/>
      <text class="chip" x="514" y="21" text-anchor="middle">Evidence Trace</text>
    </g>

    <text class="tiny" x="0" y="238">Decision-support only — not legal advice, regulatory certification, or official audit sign-off.</text>
  </g>

  <g transform="translate(878 74)" filter="url(#shadow)">
    <rect x="0" y="0" width="248" height="204" rx="24" fill="#020617" opacity="0.72" stroke="#334155"/>
    <rect x="34" y="34" width="178" height="24" rx="8" fill="#1e293b"/>
    <rect x="34" y="70" width="86" height="18" rx="6" fill="#2563eb"/>
    <rect x="126" y="70" width="86" height="18" rx="6" fill="#0f766e"/>
    <rect x="34" y="104" width="178" height="14" rx="7" fill="#334155"/>
    <rect x="34" y="130" width="150" height="14" rx="7" fill="#3b82f6"/>
    <rect x="34" y="156" width="104" height="14" rx="7" fill="#8b5cf6"/>
    <circle cx="208" cy="156" r="18" fill="#f59e0b" opacity="0.95"/>
    <path d="M208 147 L208 158 L216 162" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text class="card" x="124" y="188" text-anchor="middle">Compliance Intelligence</text>
  </g>
</svg>
