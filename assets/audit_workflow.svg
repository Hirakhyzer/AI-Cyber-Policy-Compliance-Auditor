<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Compliance audit workflow">
  <rect width="900" height="260" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#111827">
    <circle cx="90" cy="130" r="55" fill="#dbeafe" stroke="#2563eb"/><text x="90" y="125" text-anchor="middle">Collect</text><text x="90" y="147" text-anchor="middle">evidence</text>
    <circle cx="270" cy="130" r="55" fill="#dcfce7" stroke="#16a34a"/><text x="270" y="125" text-anchor="middle">Map</text><text x="270" y="147" text-anchor="middle">controls</text>
    <circle cx="450" cy="130" r="55" fill="#fef9c3" stroke="#ca8a04"/><text x="450" y="125" text-anchor="middle">Score</text><text x="450" y="147" text-anchor="middle">gaps</text>
    <circle cx="630" cy="130" r="55" fill="#fee2e2" stroke="#dc2626"/><text x="630" y="125" text-anchor="middle">Review</text><text x="630" y="147" text-anchor="middle">actions</text>
    <circle cx="810" cy="130" r="55" fill="#e5e7eb" stroke="#4b5563"/><text x="810" y="125" text-anchor="middle">Audit</text><text x="810" y="147" text-anchor="middle">ledger</text>
