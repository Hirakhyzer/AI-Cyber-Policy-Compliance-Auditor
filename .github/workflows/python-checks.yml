name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Show environment
        run: |
          python --version
          python -c "import sys; print(sys.path)"
          python -c "import cybercompliance; print(cybercompliance.__version__)"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Run synthetic compliance smoke test
        run: python scripts/run_synthetic_compliance_lab.py --controls 16 --seed 7 --output-dir outputs_ci
